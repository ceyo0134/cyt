name: build-apk
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', 'extension/**', '.github/workflows/build-apk.yml']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Latest GeckoView version
        id: gv
        run: |
          curl -fsS https://maven.mozilla.org/maven2/org/mozilla/geckoview/geckoview-arm64-v8a/maven-metadata.xml -o meta.xml
          V=$(grep -oP '(?<=<release>)[^<]+' meta.xml | head -1 || true)
          if [ -z "$V" ]; then V=$(grep -oP '(?<=<version>)[^<]+' meta.xml | tail -1); fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "GeckoView $V"
      - name: Bundle extension
        run: |
          mkdir -p android/app/src/main/assets/cyt
          cp -r extension/. android/app/src/main/assets/cyt/
      - name: Build APK
        working-directory: android
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          set +e
          gradle assembleDebug -PgeckoVersion="${{ steps.gv.outputs.version }}" --no-daemon > ../build.log 2>&1
          RC=$?
          set -e
          if [ "$RC" -ne 0 ]; then
            echo "::error::$(grep -E 'error:|wrong|Could not|FAILED|Caused by|requires|not found|Unsupported' ../build.log | head -8 | tr '\n' ' ' | cut -c1-900)"
            exit 1
          fi
          cp app/build/outputs/apk/debug/app-debug.apk ../cyt.apk
          ls -la ../cyt.apk
      - uses: actions/upload-artifact@v4
        with:
          name: cyt-apk
          path: cyt.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          for i in 1 2 3; do
            if gh release create apk-latest cyt.apk -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "cyt APK (deneme)" --notes "Deneysel APK. README dosyasina bak." 2>err.txt; then exit 0; fi
            sleep 8
          done
          echo "::error::$(tr '\n' ' ' < err.txt | cut -c1-400)"
          exit 1
