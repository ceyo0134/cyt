name: build-xpi
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package xpi
        run: |
          cd extension
          zip -r -X ../cyt.xpi . -x '*.DS_Store'
          cd ..
          unzip -l cyt.xpi | tail -3
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest cyt.xpi --prerelease --title "cyt (deneme surumu)" --notes "Deneysel surum. README'ye bak."
